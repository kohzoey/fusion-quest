<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear & Radial Gradients -->
    <linearGradient id="cyan-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35D6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#35D6FF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="gold-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="plasma-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35D6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9B7CFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9B7CFF" stop-opacity="0" />
    </radialGradient>

    <!-- Reusable Construction Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#35D6FF" opacity="0.15" />
    </pattern>
  </defs>

  <!-- BACKGROUND GUIDES & Blueprint Grid (Transparent, context only) -->
  <g opacity="0.25">
    <!-- Concentric Technical Scale Rings -->
    <circle cx="500" cy="400" r="360" fill="none" stroke="#35D6FF" stroke-width="1" stroke-dasharray="4,8" />
    <circle cx="500" cy="400" r="380" fill="none" stroke="#9B7CFF" stroke-width="0.5" />
    <circle cx="500" cy="400" r="120" fill="none" stroke="#35D6FF" stroke-width="1" stroke-dasharray="2,4" />
    
    <!-- Major Radial Axis Guides -->
    <line x1="100" y1="400" x2="900" y2="400" stroke="#35D6FF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="500" y1="50" x2="500" y2="750" stroke="#35D6FF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="217" y1="117" x2="783" y2="683" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="6,6" />
    <line x1="217" y1="683" x2="783" y2="117" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="6,6" />
  </g>

  <!-- CENTRAL SOLENOID (Fully Solid Structural Core) -->
  <g id="central-solenoid">
    <!-- Core Pillar Base -->
    <ellipse cx="500" cy="400" rx="60" ry="24" fill="none" stroke="#9B7CFF" stroke-width="2" />
    
    <!-- Vertical Solenoid Coils -->
    <path d="M 440,260 L 440,540 M 460,245 L 460,555 M 480,238 L 480,562 M 500,235 L 500,565 M 520,238 L 520,562 M 540,245 L 540,555 M 560,260 L 560,540" 
          stroke="#35D6FF" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,4" />

    <!-- Solenoid Central Bands (Active) -->
    <rect x="450" y="320" width="100" height="160" rx="5" fill="#9B7CFF" fill-opacity="0.15" stroke="#9B7CFF" stroke-width="2" filter="url(#glow-violet)" />
    <line x1="450" y1="350" x2="550" y2="350" stroke="#35D6FF" stroke-width="2" />
    <line x1="450" y1="380" x2="550" y2="380" stroke="#FFB84D" stroke-width="2" filter="url(#glow-gold)" />
    <line x1="450" y1="410" x2="550" y2="410" stroke="#35D6FF" stroke-width="2" />
    <line x1="450" y1="440" x2="550" y2="440" stroke="#35D6FF" stroke-width="2" />
  </g>

  <!-- PLASMA RING (Partial / Igniting Stream) -->
  <!-- Plasma is completed on the left/bottom, fading into particles/vector lines on the unbuilt right section -->
  <g id="plasma-chamber">
    <!-- Active Plasma Core Stream (Left Half - Complete) -->
    <path d="M 500,190 A 210,135 0 1,0 680,480" fill="none" stroke="#35D6FF" stroke-width="14" opacity="0.8" filter="url(#glow-cyan)" stroke-linecap="round" />
    <path d="M 500,190 A 210,135 0 1,0 680,480" fill="none" stroke="#FFB84D" stroke-width="4" filter="url(#glow-gold)" stroke-linecap="round" />
    
    <!-- Emerging Plasma Filament (Right Half - In Progress) -->
    <path d="M 680,480 A 210,135 0 0,0 690,290" fill="none" stroke="#35D6FF" stroke-width="3" stroke-dasharray="12,12,4,8" opacity="0.6" filter="url(#glow-cyan)" />
    <path d="M 690,290 A 210,135 0 0,0 500,190" fill="none" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="5,10" opacity="0.4" />
  </g>

  <!-- POLOIDAL & TOROIDAL FIELD COILS (The Main Tokamak Structure) -->
  <!-- Isometric/Perspective D-Shaped Magnets surrounding the Torus -->

  <!-- === SECTION 1: COMPLETED COILS (Left Side: 180° to 300°) === -->
  <g id="completed-coils" filter="url(#glow-cyan)">
    <!-- Coil 1 (Far Left - 180 deg) -->
    <path d="M 220,400 C 220,250 320,180 440,240 C 370,300 370,500 440,560 C 320,620 220,550 220,400 Z" 
          fill="#35D6FF" fill-opacity="0.15" stroke="#35D6FF" stroke-width="3" />
    
    <!-- Coil 2 (Upper Left - 215 deg) -->
    <path d="M 250,300 C 270,170 380,130 460,242 C 400,290 380,480 440,555 C 340,590 230,460 250,300 Z" 
          fill="#35D6FF" fill-opacity="0.1" stroke="#35D6FF" stroke-width="2.5" />

    <!-- Coil 3 (Bottom Left - 145 deg) -->
    <path d="M 250,500 C 230,340 340,210 440,245 C 380,320 400,510 460,558 C 380,670 270,630 250,500 Z" 
          fill="#35D6FF" fill-opacity="0.1" stroke="#35D6FF" stroke-width="2.5" />

    <!-- Solid Reinforcement Ribs on Completed Section -->
    <path d="M 220,400 L 180,400 M 230,330 L 195,315 M 230,470 L 195,485 M 260,260 L 235,230" 
          stroke="#FFB84D" stroke-width="2" filter="url(#glow-gold)" />
  </g>

  <!-- === SECTION 2: COILS IN CONSTRUCTION / SEMI-SOLID (Top & Bottom Center) === -->
  <g id="under-construction-coils">
    <!-- Coil 4 (Top Center - Solid frame, translucent fill, active assembly markers) -->
    <path d="M 400,170 C 470,150 560,200 520,250 C 460,280 450,520 520,550 C 560,600 470,650 400,630" 
          fill="none" stroke="#FFB84D" stroke-width="2" stroke-dasharray="16,4" />
    <!-- Scaffold Node Highlights -->
    <circle cx="400" cy="170" r="4" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="520" cy="250" r="3" fill="#35D6FF" />
    <circle cx="400" cy="630" r="4" fill="#FFB84D" filter="url(#glow-gold)" />

    <!-- Coil 5 (Bottom Center - Structural Casing Installed, Inner Coil Exposed) -->
    <path d="M 500,660 C 590,660 660,580 550,540 C 480,510 480,290 550,260" 
          fill="none" stroke="#9B7CFF" stroke-width="2" />
    <path d="M 510,640 C 580,640 640,570 545,535" 
          fill="none" stroke="#35D6FF" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- === SECTION 3: INCOMPLETE / OUTLINED / WIREFRAME COILS (Right Side: 0° to 120°) === -->
  <!-- Conveys "Under Construction" with blueprint vectors, dots, and alignment lines -->
  <g id="wireframe-coils" opacity="0.85">
    <!-- Coil 6 (Upper Right - Blueprint Stage) -->
    <path d="M 580,180 C 700,210 780,300 560,260 C 500,280 490,520 560,540 C 780,500 700,590 580,620" 
          fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- Alignment Vector Vectors -->
    <line x1="580" y1="180" x2="640" y2="130" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="780" y1="300" x2="840" y2="280" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="640" cy="130" r="2" fill="#9B7CFF" />
    <circle cx="840" cy="280" r="2" fill="#9B7CFF" />

    <!-- Coil 7 (Far Right - Bare Skeletal Outline) -->
    <path d="M 780,400 C 780,280 690,210 560,260" fill="none" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="4,8" />
    <path d="M 780,400 C 780,520 690,590 560,540" fill="none" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="4,8" />
    <path d="M 720,400 C 720,310 650,270 550,280" fill="none" stroke="#35D6FF" stroke-width="0.75" stroke-dasharray="2,4" />

    <!-- Modular Segment Markers (Uninstalled Blocks Floating In) -->
    <rect x="740" y="320" width="24" height="40" rx="3" fill="none" stroke="#FFB84D" stroke-width="1.5" stroke-dasharray="8,2" filter="url(#glow-gold)" />
    <line x1="752" y1="310" x2="752" y2="320" stroke="#FFB84D" stroke-width="1" />
    
    <rect x="710" y="240" width="20" height="35" rx="3" fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6,2" />
    
    <rect x="650" y="180" width="30" height="18" rx="2" fill="none" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="4,2" />
  </g>

  <!-- EXTERNAL VACUUM VESSEL & CRANE / SCAFFOLDING ELEMENTS -->
  <!-- Adds the "Museum/Educational Construction" Context -->
  <g id="scaffolding-and-geometry">
    <!-- Outer Containment Perimeter (Geometric Arc Segment) -->
    <path d="M 180,400 A 340,220 0 0,1 780,240" fill="none" stroke="#35D6FF" stroke-width="0.75" stroke-dasharray="20,10,5,10" opacity="0.4" />
    <path d="M 180,400 A 340,220 0 0,0 680,590" fill="none" stroke="#35D6FF" stroke-width="0.75" stroke-dasharray="20,10,5,10" opacity="0.4" />

    <!-- Construction Guide Laser / Projection Beam -->
    <polygon points="500,50 505,50 660,180 650,180" fill="url(#cyan-fade)" opacity="0.3" />
    <line x1="500" y1="50" x2="655" y2="180" stroke="#35D6FF" stroke-width="1" filter="url(#glow-cyan)" />
    <circle cx="500" cy="50" r="3" fill="#35D6FF" filter="url(#glow-cyan)" />

    <!-- Assembly Rigging Coordinates (Right Side Construction Zone) -->
    <g stroke="#FFB84D" stroke-width="1" opacity="0.7">
      <!-- Target Reticle 1 -->
      <circle cx="752" cy="340" r="12" fill="none" stroke-dasharray="6,3" />
      <line x1="752" y1="322" x2="752" y2="358" stroke-width="0.5" />
      <line x1="734" y1="340" x2="770" y2="340" stroke-width="0.5" />
      
      <!-- Target Reticle 2 -->
      <circle cx="665" cy="189" r="8" fill="none" stroke="#35D6FF" stroke-dasharray="4,2" />
      
      <!-- Tangent Measuring Vectors -->
      <line x1="740" y1="320" x2="665" y2="189" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="4,4" />
    </g>

    <!-- Support Pedestals / Base Structure (Flat Minimalist Blocks) -->
    <path d="M 300,600 L 300,670 L 340,670 L 340,618" fill="none" stroke="#35D6FF" stroke-width="1.5" />
    <path d="M 480,645 L 480,720 L 520,720 L 520,645" fill="none" stroke="#35D6FF" stroke-width="1.5" />
    <path d="M 660,570 L 660,650 L 700,650 L 700,530" fill="none" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- ABSTRACT TECHNICAL ACCENTS / PARTICLES -->
  <!-- Floating data nodes, calibration marks, and glowing energy bursts -->
  <g id="technical-details">
    <!-- Glowing Progress Nodes -->
    <circle cx="300" cy="195" r="4" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="210" cy="300" r="3" fill="#35D6FF" filter="url(#glow-cyan)" />
    <circle cx="170" cy="400" r="5" fill="#35D6FF" filter="url(#glow-cyan)" />
    <circle cx="210" cy="500" r="3" fill="#35D6FF" filter="url(#glow-cyan)" />
    <circle cx="440" cy="240" r="3" fill="#9B7CFF" filter="url(#glow-violet)" />
    
    <!-- Unfinished Structural "Spark" Points (Assembly in action) -->
    <g filter="url(#glow-gold)">
      <circle cx="650" cy="180" r="2" fill="#FFB84D" />
      <line x1="645" y1="175" x2="655" y2="185" stroke="#FFB84D" stroke-width="1" />
      <line x1="655" y1="175" x2="645" y2="185" stroke="#FFB84D" stroke-width="1" />

      <circle cx="740" cy="320" r="2" fill="#FFB84D" />
      <line x1="735" y1="315" x2="745" y2="325" stroke="#FFB84D" stroke-width="1" />
      <line x1="745" y1="315" x2="735" y2="325" stroke="#FFB84D" stroke-width="1" />
    </g>

    <!-- Measurement Arcs & Angle Indicators -->
    <path d="M 500,320 A 80,80 0 0,1 556,344" fill="none" stroke="#FFB84D" stroke-width="1" stroke-dasharray="2,2" />
    <path d="M 500,310 A 90,90 0 0,1 563,337" fill="none" stroke="#35D6FF" stroke-width="0.5" />
    
    <!-- Minimalist Scale Crossbars -->
    <g stroke="#35D6FF" stroke-width="1" opacity="0.6">
      <line x1="120" y1="700" x2="160" y2="700" />
      <line x1="120" y1="695" x2="120" y2="705" />
      <line x1="160" y1="695" x2="160" y2="705" />
      
      <line x1="120" y1="710" x2="240" y2="710" stroke-dasharray="4,4" />
      <line x1="240" y1="705" x2="240" y2="715" />
    </g>
  </g>
</svg>
