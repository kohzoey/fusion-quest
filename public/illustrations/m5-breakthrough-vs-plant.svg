<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="path-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#35D6FF" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#9B7CFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9B7CFF" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="beam-fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND GUIDES / TECHNICAL GRID (Educational Poster Style) -->
  <g opacity="0.2">
    <!-- Horizontal Baseline Grid -->
    <line x1="80" y1="580" x2="1120" y2="580" stroke="#35D6FF" stroke-width="1" stroke-dasharray="8,6" />
    <line x1="80" y1="180" x2="1120" y2="180" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="4,8" />
    
    <!-- Vertical Datum Lines for Checkpoints -->
    <line x1="150" y1="100" x2="150" y2="620" stroke="#35D6FF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="330" y1="100" x2="330" y2="620" stroke="#35D6FF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="510" y1="100" x2="510" y2="620" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="690" y1="100" x2="690" y2="620" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="870" y1="100" x2="870" y2="620" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="12,6" />
    <line x1="1050" y1="100" x2="1050" y2="620" stroke="#9B7CFF" stroke-width="0.5" stroke-dasharray="12,6" />
  </g>

  <!-- ASCENDING STAIRCASE / PATHWAY STRUCTURE -->
  <g id="staircase-path">
    <!-- Geometric Stepped Path Base Line -->
    <path d="M 100,580 
             L 150,580 L 150,500 
             L 330,500 L 330,420 
             L 510,420 L 510,340 
             L 690,340 L 690,260 
             L 870,260 L 870,180 
             L 1050,180" 
          fill="none" stroke="url(#path-gradient)" stroke-width="3" stroke-linecap="square" />

    <!-- Fill under completed steps (Glowing Foundation) -->
    <polygon points="100,580 150,580 150,500 330,500 330,580" fill="url(#beam-fade)" opacity="0.3" />
    
    <!-- Faint Under-Structure / Projection Vectors -->
    <path d="M 150,500 L 1050,100" stroke="#35D6FF" stroke-width="0.75" stroke-dasharray="4,6" opacity="0.3" />
    <path d="M 100,580 L 1050,180" stroke="#9B7CFF" stroke-width="0.75" stroke-dasharray="2,6" opacity="0.25" />
  </g>

  <!-- CHECKPOINTS ALONG THE PATHWAY -->

  <!-- CHECKPOINT 1: IGNITION / NET ENERGY GAIN (Achieved - Gold/Orange Glow) -->
  <g id="checkpoint-1">
    <!-- Vertical Beacon Line -->
    <line x1="150" y1="580" x2="150" y2="440" stroke="#FFB84D" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#glow-gold)" />
    
    <!-- Outer Target Reticle -->
    <circle cx="150" cy="500" r="18" fill="none" stroke="#FFB84D" stroke-width="1.5" filter="url(#glow-gold)" />
    <circle cx="150" cy="500" r="10" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="150" cy="500" r="4" fill="#FFFFFF" />

    <!-- Achieved Milestone Symbol (Solid Geometric Star/Cross) -->
    <path d="M 150,470 L 153,477 L 160,480 L 153,483 L 150,490 L 147,483 L 140,480 L 147,477 Z" fill="#FFB84D" filter="url(#glow-gold)" />
  </g>

  <!-- CHECKPOINT 2: SUSTAINED REACTION (Achieved - Bright Cyan Glow) -->
  <g id="checkpoint-2">
    <!-- Vertical Beacon Line -->
    <line x1="330" y1="500" x2="330" y2="360" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#glow-cyan)" />

    <!-- Outer Target Reticle -->
    <circle cx="330" cy="420" r="16" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
    <circle cx="330" cy="420" r="8" fill="#35D6FF" filter="url(#glow-cyan)" />
    <circle cx="330" cy="420" r="3" fill="#FFFFFF" />

    <!-- Science Graphic Accent: Concentric Orbit Ring -->
    <ellipse cx="330" cy="420" rx="26" ry="10" fill="none" stroke="#35D6FF" stroke-width="1" stroke-dasharray="6,3" opacity="0.8" filter="url(#glow-cyan)" />
  </g>

  <!-- CHECKPOINT 3: SCALABLE ENGINEERING / TRITIUM BREEDING (Transition - Soft Violet Glow) -->
  <g id="checkpoint-3">
    <!-- Outer Ring -->
    <circle cx="510" cy="340" r="14" fill="none" stroke="#9B7CFF" stroke-width="1.5" filter="url(#glow-violet)" />
    <circle cx="510" cy="340" r="5" fill="#9B7CFF" opacity="0.8" filter="url(#glow-violet)" />

    <!-- Calibration Crosshair Marks -->
    <line x1="510" y1="320" x2="510" y2="324" stroke="#9B7CFF" stroke-width="1" />
    <line x1="510" y1="356" x2="510" y2="360" stroke="#9B7CFF" stroke-width="1" />
    <line x1="490" y1="340" x2="494" y2="340" stroke="#9B7CFF" stroke-width="1" />
    <line x1="526" y1="340" x2="530" y2="340" stroke="#9B7CFF" stroke-width="1" />
  </g>

  <!-- CHECKPOINT 4: PILOT PLANT / CONTINUOUS Q>10 (Unreached - Faint Violet Outline) -->
  <g id="checkpoint-4" opacity="0.6">
    <circle cx="690" cy="260" r="12" fill="none" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="4,3" />
    <circle cx="690" cy="260" r="2" fill="#9B7CFF" />
  </g>

  <!-- CHECKPOINT 5: COMMERCIAL GRID INTEGRATION (Unreached - Very Faint Outline) -->
  <g id="checkpoint-5" opacity="0.35">
    <circle cx="870" cy="180" r="10" fill="none" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="870" cy="180" r="1.5" fill="#9B7CFF" />
  </g>

  <!-- FINAL DESTINATION: COMPLETE POWER PLANT (Unlit, Outline Only, Minimalist Vector) -->
  <g id="power-plant-destination" transform="translate(1050, 180)">
    <!-- Base Platform -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" />

    <!-- Cooling Tower Outline (Faint Technical Blueprint Style) -->
    <path d="M -40,0 C -35,-40 -20,-80 -25,-110 L 25,-110 C 20,-80 35,-40 40,0 Z" 
          fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />

    <!-- Containment Dome Outline -->
    <path d="M -20,0 A 20,20 0 0,1 20,0" fill="none" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" />

    <!-- Central Fusion Core Placeholder (Dotted Future Target) -->
    <circle cx="0" cy="-45" r="16" fill="none" stroke="#9B7CFF" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
    <circle cx="0" cy="-45" r="4" fill="none" stroke="#35D6FF" stroke-width="1" opacity="0.4" />

    <!-- Transmission Grid Lines (Faint Rays Spreading Out) -->
    <path d="M 25,-110 L 45,-140 M 35,-110 L 65,-130 M 40,-90 L 75,-100" stroke="#35D6FF" stroke-width="0.75" stroke-dasharray="3,4" opacity="0.3" />

    <!-- Target Reticle around Unfinished Power Plant -->
    <circle cx="0" cy="-45" r="55" fill="none" stroke="#FFB84D" stroke-width="0.75" stroke-dasharray="2,6" opacity="0.3" />
  </g>

  <!-- EDUCATIONAL VECTOR / GRAPHIC ACCENTS -->
  <g id="graphic-accents">
    <!-- Progress Indicator Vector (Bottom Axis) -->
    <g transform="translate(100, 620)" opacity="0.8">
      <line x1="0" y1="0" x2="950" y2="0" stroke="#35D6FF" stroke-width="1" stroke-dasharray="12,6" />
      <polygon points="950,-4 960,0 950,4" fill="#35D6FF" />
      
      <!-- Axis Tick Marks -->
      <line x1="50" y1="-5" x2="50" y2="5" stroke="#FFB84D" stroke-width="1.5" filter="url(#glow-gold)" />
      <line x1="230" y1="-5" x2="230" y2="5" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <line x1="410" y1="-5" x2="410" y2="5" stroke="#9B7CFF" stroke-width="1" />
      <line x1="590" y1="-5" x2="590" y2="5" stroke="#9B7CFF" stroke-width="1" opacity="0.6" />
      <line x1="770" y1="-5" x2="770" y2="5" stroke="#9B7CFF" stroke-width="1" opacity="0.4" />
      <line x1="950" y1="-5" x2="950" y2="5" stroke="#9B7CFF" stroke-width="1" opacity="0.3" />
    </g>

    <!-- Floating Energy Particles near Ignition Checkpoint -->
    <g opacity="0.7" filter="url(#glow-gold)">
      <circle cx="130" cy="460" r="1.5" fill="#FFB84D" />
      <circle cx="170" cy="450" r="2" fill="#FFB84D" />
      <circle cx="180" cy="520" r="1" fill="#FFB84D" />
      <circle cx="120" cy="530" r="2.5" fill="#FFB84D" />
    </g>
  </g>
</svg>
