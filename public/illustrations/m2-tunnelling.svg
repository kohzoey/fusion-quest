<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.85" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vector Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#35D6FF" />
    </marker>

    <marker id="arrow-violet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9B7CFF" opacity="0.6" />
    </marker>

    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FFB84D" />
    </marker>
  </defs>

  <!-- NOTE: TRANSPARENT BACKGROUND (No background rect or fill) -->

  <!-- Abstract Cosmic Grid & Axis Alignments -->
  <g stroke="#35D6FF" stroke-width="1" opacity="0.12" fill="none">
    <line x1="100" y1="520" x2="1100" y2="520" />
    <line x1="100" y1="200" x2="1100" y2="200" stroke-dasharray="4 8" />
    <line x1="600" y1="120" x2="600" y2="520" stroke-dasharray="4 8" />
  </g>

  <!-- ==================== ENERGY BARRIER HILL ==================== -->
  <!-- Smooth Hill-Shaped Coulomb Barrier Surface -->
  <path d="M 150 520 
           L 300 520 
           C 420 520, 480 200, 600 200 
           C 720 200, 780 520, 900 520 
           L 1050 520" 
        fill="none" stroke="#9B7CFF" stroke-width="3" filter="url(#glow-violet)" />

  <!-- Inner Subtle Barrier Grid Lines (Field Visualization) -->
  <path d="M 340 520 C 440 520, 490 240, 600 240 C 710 240, 760 520, 860 520" 
        fill="none" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35" />
  <path d="M 380 520 C 460 520, 500 280, 600 280 C 700 280, 740 520, 820 520" 
        fill="none" stroke="#35D6FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.2" />

  <!-- ==================== APPROACHING NUCLEI ==================== -->
  <!-- Incident Nucleus Source (Far Left) -->
  <g id="approaching-nucleus" transform="translate(180, 380)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#35D6FF" stroke-width="2.5" filter="url(#glow-cyan)" />
    <circle cx="0" cy="0" r="20" fill="#35D6FF" fill-opacity="0.3" />
    <!-- (+) Positive Charge Geometry Symbol -->
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Incident Velocity Vectors -->
  <path d="M 220 380 L 320 380" fill="none" stroke="#35D6FF" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />

  <!-- ==================== BOUNCING PATHS (REFLECTED / REPELLED) ==================== -->
  <!-- Upper Repelled Path -->
  <path d="M 330 360 C 420 360, 450 310, 420 220 T 300 140" 
        fill="none" stroke="#9B7CFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" marker-end="url(#arrow-violet)" />

  <!-- Mid-Hill Reflected Path -->
  <path d="M 330 380 C 450 380, 480 370, 410 440 T 280 480" 
        fill="none" stroke="#9B7CFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" marker-end="url(#arrow-violet)" />

  <!-- Low Energy Deflection Path -->
  <path d="M 330 400 C 400 400, 420 430, 360 480 T 260 510" 
        fill="none" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- ==================== QUANTUM TUNNELING PATH (RARE EVENT) ==================== -->
  <!-- Single Faint Glowing Path Penetrating/Passing Through Barrier -->
  <path d="M 330 380 L 870 380" 
        fill="none" stroke="#FFB84D" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85" filter="url(#glow-gold)" />

  <!-- Transmitted Tunneled Particle Vector Arrow -->
  <path d="M 870 380 L 960 380" fill="none" stroke="#FFB84D" stroke-width="2.5" marker-end="url(#arrow-gold)" filter="url(#glow-gold)" />

  <!-- Tunneled Nucleus Emerging (Far Right) -->
  <g id="tunneled-nucleus" transform="translate(980, 380)">
    <!-- High-Energy Tunneled Core Halo -->
    <circle cx="0" cy="0" r="38" fill="#FFB84D" fill-opacity="0.08" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FFB84D" stroke-width="2.5" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="18" fill="#FFB84D" fill-opacity="0.5" filter="url(#glow-gold)" />
    <!-- (+) Positive Charge Symbol -->
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Probability Interaction Node Accents -->
  <circle cx="500" cy="380" r="4" fill="#FFB84D" filter="url(#glow-gold)" />
  <circle cx="600" cy="380" r="5" fill="#FFB84D" filter="url(#glow-gold)" />
  <circle cx="700" cy="380" r="4" fill="#FFB84D" filter="url(#glow-gold)" />
</svg>
