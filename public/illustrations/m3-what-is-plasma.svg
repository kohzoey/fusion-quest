<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.85" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vector Arrowhead Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#35D6FF" />
    </marker>

    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FFB84D" />
    </marker>
  </defs>

  <!-- NOTE: TRANSPARENT BACKGROUND (No background rect or fill) -->

  <!-- Center Split Line (Museum Poster Layout Divider) -->
  <line x1="600" y1="90" x2="600" y2="585" stroke="#35D6FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6" />

  <!-- Transition Process Vector Line -->
  <path d="M 450 337.5 L 550 337.5" stroke="#FFB84D" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-gold)" filter="url(#glow-gold)" />

  <!-- ==================== LEFT SIDE: ATOM LOSING ELECTRON ==================== -->
  <g id="neutral-atom-ionizing">
    <!-- Abstract Orbital Axis Alignments -->
    <g stroke="#35D6FF" stroke-width="1" opacity="0.12" fill="none">
      <circle cx="300" cy="337.5" r="220" stroke-dasharray="4 8" />
    </g>

    <!-- Elliptical Electron Orbit Rings -->
    <ellipse cx="300" cy="337.5" rx="140" ry="50" fill="none" stroke="#35D6FF" stroke-width="1.5" opacity="0.4" transform="rotate(-30, 300, 337.5)" />
    <ellipse cx="300" cy="337.5" rx="140" ry="50" fill="none" stroke="#35D6FF" stroke-width="1.5" opacity="0.4" transform="rotate(30, 300, 337.5)" />
    
    <!-- Outer Escaping Orbit (Dashed) -->
    <ellipse cx="300" cy="337.5" rx="150" ry="55" fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#glow-cyan)" />

    <!-- Central Nucleus -->
    <g transform="translate(300, 337.5)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#35D6FF" stroke-width="2.5" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="22" fill="#35D6FF" fill-opacity="0.3" />
      <!-- Positive Charge (+) Core -->
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Bound Electron -->
    <circle cx="210" cy="250" r="7" fill="#35D6FF" filter="url(#glow-cyan)" />

    <!-- Escaping Outer Electron (Flying Away) -->
    <g id="escaping-electron">
      <!-- Escape Trajectory Vector Arrow -->
      <path d="M 400 240 L 465 185" fill="none" stroke="#35D6FF" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />
      <!-- Escaping Dot -->
      <circle cx="400" cy="240" r="8" fill="#35D6FF" filter="url(#glow-cyan)" />
      <circle cx="400" cy="240" r="14" fill="none" stroke="#35D6FF" stroke-width="1.5" opacity="0.6" />
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: PLASMA / IONIZED PARTICLE CLOUD ==================== -->
  <g id="fully-ionized-plasma">
    <!-- Abstract Cosmic Grid Alignments -->
    <g stroke="#35D6FF" stroke-width="1" opacity="0.12" fill="none">
      <circle cx="900" cy="337.5" r="220" stroke-dasharray="4 8" />
    </g>

    <!-- Thermal Energy Field Boundary (Soft Plasma Cloud Glow) -->
    <circle cx="900" cy="337.5" r="160" fill="#9B7CFF" fill-opacity="0.06" filter="url(#glow-violet)" />
    <circle cx="900" cy="337.5" r="120" fill="#FFB84D" fill-opacity="0.08" filter="url(#glow-gold)" />
    <circle cx="900" cy="337.5" r="170" fill="none" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" filter="url(#glow-violet)" />

    <!-- Free Positively Charged Ions (+) -->
    <!-- Positive Ion 1 -->
    <g transform="translate(840, 260)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="15" fill="#35D6FF" fill-opacity="0.3" />
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Positive Ion 2 -->
    <g transform="translate(970, 310)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#FFB84D" stroke-width="2" filter="url(#glow-gold)" />
      <circle cx="0" cy="0" r="16" fill="#FFB84D" fill-opacity="0.3" />
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Positive Ion 3 -->
    <g transform="translate(860, 410)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="14" fill="#35D6FF" fill-opacity="0.3" />
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Free Negatively Charged Electrons (-) -->
    <!-- Electron 1 -->
    <g transform="translate(940, 210)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#9B7CFF" stroke-width="1.5" filter="url(#glow-violet)" />
      <circle cx="0" cy="0" r="5" fill="#9B7CFF" />
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Electron 2 -->
    <g transform="translate(770, 330)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#9B7CFF" stroke-width="1.5" filter="url(#glow-violet)" />
      <circle cx="0" cy="0" r="5" fill="#9B7CFF" />
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Electron 3 -->
    <g transform="translate(930, 440)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#9B7CFF" stroke-width="1.5" filter="url(#glow-violet)" />
      <circle cx="0" cy="0" r="5" fill="#9B7CFF" />
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Electron 4 -->
    <g transform="translate(1010, 390)">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="4" fill="#35D6FF" />
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Subtle Thermal Motion Lines -->
    <path d="M 925 200 C 935 190, 950 200, 955 190" fill="none" stroke="#9B7CFF" stroke-width="1" opacity="0.6" />
    <path d="M 755 330 C 745 320, 750 305, 740 300" fill="none" stroke="#9B7CFF" stroke-width="1" opacity="0.6" />
    <path d="M 985 310 C 1000 300, 1005 320, 1020 315" fill="none" stroke="#FFB84D" stroke-width="1" opacity="0.6" />
  </g>
</svg>
