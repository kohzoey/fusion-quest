<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#07111F" />

  <!-- Abstract Cosmic Grid Lines (Museum Poster Aesthetic) -->
  <g stroke="#35D6FF" stroke-width="1" opacity="0.12" fill="none">
    <circle cx="850" cy="220" r="180" stroke-dasharray="4 6" />
    <circle cx="850" cy="220" r="260" stroke-dasharray="8 8" />
    <line x1="850" y1="20" x2="850" y2="420" stroke-dasharray="4 4" />
    <line x1="650" y1="220" x2="1050" y2="220" stroke-dasharray="4 4" />
  </g>

  <!-- ==================== CELESTIAL MYSTERY (TOP RIGHT) ==================== -->
  <g id="celestial-core">
    <!-- Outer Stellar Aura -->
    <circle cx="850" cy="220" r="70" fill="#FFB84D" fill-opacity="0.08" filter="url(#glow-gold)" />
    <circle cx="850" cy="220" r="50" fill="#FFB84D" fill-opacity="0.2" filter="url(#glow-gold)" />
    
    <!-- Central Glowing Star / Sun -->
    <circle cx="850" cy="220" r="32" fill="none" stroke="#FFB84D" stroke-width="3" filter="url(#glow-gold)" />
    <circle cx="850" cy="220" r="22" fill="#FFB84D" />

    <!-- Minimal Rays -->
    <path d="M 850 150 L 850 130 M 850 290 L 850 310 M 780 220 L 760 220 M 920 220 L 940 220" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Faint Geometric Question Marks (Unsolved Mystery) -->
    <!-- Question Mark 1 (Cyan) -->
    <path d="M 760 140 C 760 120, 785 120, 785 138 C 785 152, 770 158, 770 172 M 770 184 L 770 188" fill="none" stroke="#35D6FF" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-cyan)" opacity="0.75" />
    
    <!-- Question Mark 2 (Violet) -->
    <path d="M 925 125 C 925 105, 950 105, 950 123 C 950 137, 935 143, 935 157 M 935 169 L 935 173" fill="none" stroke="#9B7CFF" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-violet)" opacity="0.7" />

    <!-- Question Mark 3 (Smaller Accent) -->
    <path d="M 885 295 C 885 282, 902 282, 902 294 C 902 303, 892 307, 892 316 M 892 324 L 892 327" fill="none" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- ==================== SIGHTLINE VECTOR ==================== -->
  <line x1="395" y1="420" x2="815" y2="238" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35" filter="url(#glow-cyan)" />

  <!-- ==================== SILHOUETTE: ASTRONOMER & TELESCOPE ==================== -->
  <g id="astronomer-silhouette" fill="#07111F" stroke="#35D6FF" stroke-width="1.5" opacity="0.95">
    <!-- Telescope Tripod (Geometric Flat Vectors) -->
    <path d="M 330 460 L 250 675" stroke="#35D6FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 330 460 L 330 675" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 330 460 L 410 675" stroke="#35D6FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="330" cy="460" r="6" fill="#35D6FF" stroke="none" />

    <!-- 1920s-Style Brass Telescope Main Barrel -->
    <g transform="rotate(-23, 330, 460)">
      <rect x="230" y="453" width="220" height="14" rx="2" fill="#07111F" stroke="#35D6FF" stroke-width="2" />
      <rect x="450" y="451" width="35" height="18" rx="1" fill="#07111F" stroke="#35D6FF" stroke-width="2" />
      <rect x="205" y="455" width="25" height="10" rx="1" fill="#07111F" stroke="#35D6FF" stroke-width="1.5" />
    </g>

    <!-- Astronomer Profile Silhouette (Clean 1920s Formal Contour - No Facial Detail) -->
    <!-- Head/Flat Cap Contour -->
    <path d="M 235 520 C 235 500, 252 490, 270 495 C 285 500, 290 512, 290 525 C 280 528, 275 530, 260 530 C 245 530, 235 525, 235 520 Z" fill="#07111F" stroke="#35D6FF" stroke-width="1.5" />
    
    <!-- Torso & 1920s Suit Collar/Shoulder Line -->
    <path d="M 238 530 L 220 675 L 315 675 L 285 540 Z" fill="#07111F" stroke="#35D6FF" stroke-width="1.5" />
    
    <!-- Arm Adjusting Eyepiece -->
    <path d="M 270 550 L 250 515 L 230 500" fill="none" stroke="#35D6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Ground Line Accent -->
  <line x1="100" y1="675" x2="1100" y2="675" stroke="#35D6FF" stroke-width="2" opacity="0.3" />
</svg>
