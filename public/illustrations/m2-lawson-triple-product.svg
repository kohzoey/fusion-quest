<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.85" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vector Flow Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#35D6FF" />
    </marker>

    <marker id="arrow-violet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9B7CFF" />
    </marker>
  </defs>

  <!-- NOTE: TRANSPARENT BACKGROUND (No background rect or fill) -->

  <!-- Abstract Cosmic Grid Alignments -->
  <g stroke="#35D6FF" stroke-width="1" opacity="0.1" fill="none">
    <line x1="800" y1="90" x2="800" y2="585" stroke-dasharray="4 4" />
    <circle cx="800" cy="380" r="220" stroke-dasharray="4 8" />
  </g>

  <!-- ==================== FAINT IGNITION THRESHOLD LINE ==================== -->
  <g id="threshold-line">
    <!-- Horizontal Milestone Threshold -->
    <line x1="600" y1="210" x2="1000" y2="210" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
    <!-- Threshold Target Marker Arrows -->
    <path d="M 600 210 L 615 203 M 600 210 L 615 217" stroke="#35D6FF" stroke-width="1.5" opacity="0.5" />
    <path d="M 1000 210 L 985 203 M 1000 210 L 985 217" stroke="#35D6FF" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- ==================== THREE CONDITION ICONS (LEFT COLUMN) ==================== -->

  <!-- ICON 1 (TOP LEFT): THERMOMETER -->
  <g id="icon-temperature" transform="translate(200, 160)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
    <!-- Thermometer Shape -->
    <circle cx="0" cy="12" r="9" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="0" cy="12" r="9" fill="none" stroke="#35D6FF" stroke-width="1.5" />
    <path d="M -4 -14 L -4 6 A 9 9 0 0 0 4 6 L 4 -14 Z" fill="none" stroke="#35D6FF" stroke-width="1.5" />
    <circle cx="0" cy="-14" r="4" fill="none" stroke="#35D6FF" stroke-width="1.5" />
    <line x1="0" y1="12" x2="0" y2="-4" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" filter="url(#glow-gold)" />
  </g>

  <!-- ICON 2 (MID LEFT): DENSITY / DOT CLUSTER -->
  <g id="icon-density" transform="translate(180, 380)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#9B7CFF" stroke-width="1.5" filter="url(#glow-violet)" />
    <!-- Spacing Dot Cluster -->
    <circle cx="0" cy="0" r="4" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="-6" cy="-5" r="3" fill="#9B7CFF" />
    <circle cx="6" cy="-5" r="3" fill="#35D6FF" />
    <circle cx="-5" cy="6" r="3" fill="#35D6FF" />
    <circle cx="6" cy="5" r="3" fill="#9B7CFF" />
    <circle cx="-14" cy="-2" r="2" fill="#9B7CFF" opacity="0.7" />
    <circle cx="15" cy="1" r="2" fill="#35D6FF" opacity="0.7" />
    <circle cx="-1" cy="-15" r="2" fill="#35D6FF" opacity="0.7" />
    <circle cx="1" cy="14" r="2" fill="#9B7CFF" opacity="0.7" />
  </g>

  <!-- ICON 3 (BOTTOM LEFT): HOURGLASS / TIME -->
  <g id="icon-time" transform="translate(200, 560)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
    <!-- Hourglass Shape -->
    <path d="M -14 -15 L 14 -15 L 2 0 L 14 15 L -14 15 L -2 0 Z" 
          fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="-16" y1="-15" x2="16" y2="-15" stroke="#35D6FF" stroke-width="1.5" />
    <line x1="-16" y1="15" x2="16" y2="15" stroke="#35D6FF" stroke-width="1.5" />
    <polygon points="-8,-11 8,-11 0,-2" fill="#FFB84D" opacity="0.6" />
    <polygon points="-9,13 9,13 0,4" fill="#FFB84D" opacity="0.85" filter="url(#glow-gold)" />
  </g>

  <!-- ==================== FLOW CONVERGENCE PATHS ==================== -->
  <g id="flow-paths" fill="none">
    <!-- Top Stream (Temperature) -->
    <path d="M 245 160 C 450 160, 550 340, 720 370" 
          stroke="#35D6FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />

    <!-- Mid Stream (Density) -->
    <path d="M 225 380 C 420 380, 550 380, 715 380" 
          stroke="#9B7CFF" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85" marker-end="url(#arrow-violet)" filter="url(#glow-violet)" />

    <!-- Bottom Stream (Time) -->
    <path d="M 245 560 C 450 560, 550 420, 720 390" 
          stroke="#35D6FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />
  </g>

  <!-- ==================== CENTRAL ACCUMULATING GLOWING ORB ==================== -->
  <!-- Positioned at (800, 380), Below Threshold Line y=210 -->
  <g id="glowing-orb" transform="translate(800, 380)">
    <!-- Outer Diffuse Radiance Halos (Representing Intensity/Triple Product Magnitude) -->
    <circle cx="0" cy="0" r="140" fill="#FFB84D" fill-opacity="0.04" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="105" fill="#FFB84D" fill-opacity="0.1" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="75" fill="#FFB84D" fill-opacity="0.2" filter="url(#glow-gold)" />

    <!-- Concentric Field Alignment Rings -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFB84D" stroke-width="2.5" filter="url(#glow-gold)" />

    <!-- Radiant High-Energy Core -->
    <circle cx="0" cy="0" r="32" fill="#FFB84D" fill-opacity="0.9" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" filter="url(#glow-gold)" />

    <!-- Upward Approach Direction Vector (Toward Threshold Line) -->
    <path d="M 0 -65 L 0 -140" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" filter="url(#glow-gold)" />
    <polygon points="0,-152 -6,-138 6,-138" fill="#FFB84D" filter="url(#glow-gold)" />
  </g>
</svg>
