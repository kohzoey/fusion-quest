<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-orange-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Central Neutral Axis Marker -->
    <line x1="500" y1="120" x2="500" y2="480" stroke="#9B7CFF" stroke-width="1" opacity="0.25" stroke-dasharray="4 8" />

    <!-- ================= 1. LEFT ICON: HIGH-LEVEL / LONG-LIVED WASTE ================= -->
    <!-- Larger size, multi-layered containment, intense warm gold/orange glow, long-decay aura -->
    <g transform="translate(280, 300)">
      <!-- Outer Long-Duration Decay Orbit Rings -->
      <circle cx="0" cy="0" r="135" fill="none" stroke="#FFB84D" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="2 6" filter="url(#glow-orange-intense)" />
      <circle cx="0" cy="0" r="115" fill="none" stroke="#9B7CFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6" />
      <circle cx="0" cy="0" r="95" fill="none" stroke="#FFB84D" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow-orange-intense)" />

      <!-- Massive Hexagonal Heavy-Shielding Outer Vessel -->
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="none" stroke="#9B7CFF" stroke-width="2" stroke-linejoin="round" opacity="0.8" />
      
      <!-- Inner Heavy Containment Barrel Body -->
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#FFB84D" fill-opacity="0.12" stroke="#FFB84D" stroke-width="3" stroke-linejoin="round" filter="url(#glow-orange-intense)" />

      <!-- High-Intensity Radioactive Core / Trefoil Symbol -->
      <g filter="url(#glow-orange-intense)">
        <!-- Outer Trefoil Ring -->
        <circle cx="0" cy="0" r="32" fill="none" stroke="#FFB84D" stroke-width="2" />
        
        <!-- Trefoil Blades -->
        <path d="M 0 0 L -12 -20.7 A 24 24 0 0 1 12 -20.7 Z" fill="#FFB84D" />
        <path d="M 0 0 L 23.9 0.1 A 24 24 0 0 1 11.9 20.8 Z" fill="#FFB84D" />
        <path d="M 0 0 L -11.9 20.8 A 24 24 0 0 1 -23.9 0.1 Z" fill="#FFB84D" />
        
        <!-- Central Core Hub -->
        <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
      </g>

      <!-- Persistent Radiation / Heat Energy Pulses -->
      <g stroke="#FFB84D" stroke-width="1.5" stroke-linecap="round" opacity="0.8" filter="url(#glow-orange-intense)">
        <line x1="0" y1="-82" x2="0" y2="-90" />
        <line x1="0" y1="82" x2="0" y2="90" />
        <line x1="-82" y1="0" x2="-90" y2="0" />
        <line x1="82" y1="0" x2="90" y2="0" />
        <line x1="-58" y1="-58" x2="-64" y2="-64" />
        <line x1="58" y1="58" x2="64" y2="64" />
        <line x1="58" y1="-58" x2="64" y2="-64" />
        <line x1="-58" y1="58" x2="-64" y2="64" />
      </g>
    </g>

    <!-- ================= 2. RIGHT ICON: LOW-LEVEL / SHORT-LIVED WASTE ================= -->
    <!-- Smaller scale, simpler single-layer containment, soft cyan glow, contained activity -->
    <g transform="translate(720, 300)">
      <!-- Outer Short-Duration Decay Boundary Circle -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#9B7CFF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 5" />
      <circle cx="0" cy="0" r="60" fill="none" stroke="#35D6FF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 4" />

      <!-- Compact Single-Wall Shielding Vessel -->
      <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#35D6FF" fill-opacity="0.08" stroke="#35D6FF" stroke-width="2.2" stroke-linejoin="round" filter="url(#glow-cyan-soft)" />

      <!-- Low-Intensity / Low-Activation Core Symbol -->
      <g filter="url(#glow-cyan-soft)">
        <!-- Outer Trefoil Ring -->
        <circle cx="0" cy="0" r="20" fill="none" stroke="#35D6FF" stroke-width="1.5" opacity="0.9" />
        
        <!-- Subtle Trefoil Blades -->
        <path d="M 0 0 L -7.5 -13 A 15 15 0 0 1 7.5 -13 Z" fill="#35D6FF" opacity="0.85" />
        <path d="M 0 0 L 15 0 A 15 15 0 0 1 7.5 13 Z" fill="#35D6FF" opacity="0.85" />
        <path d="M 0 0 L -7.5 13 A 15 15 0 0 1 -15 0 Z" fill="#35D6FF" opacity="0.85" />
        
        <!-- Central Core Hub -->
        <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
      </g>

      <!-- Short-Range Activity Indicators -->
      <g stroke="#35D6FF" stroke-width="1.2" stroke-linecap="round" opacity="0.5" filter="url(#glow-cyan-soft)">
        <line x1="0" y1="-48" x2="0" y2="-53" />
        <line x1="0" y1="48" x2="0" y2="53" />
        <line x1="-48" y1="0" x2="-53" y2="0" />
        <line x1="48" y1="0" x2="53" y2="0" />
      </g>
    </g>
  </g>
</svg>
