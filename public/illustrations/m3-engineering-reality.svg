<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrow Markers for Heat/Neutron Flux -->
    <marker id="flux-arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FFB84D" />
    </marker>

    <marker id="flux-arrow-violet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9B7CFF" />
    </marker>

    <!-- Plasma Core Gradients -->
    <radialGradient id="plasma-core-grad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#9B7CFF" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#35D6FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#35D6FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- ================= 1. OUTCOME / WALL STRUCTURE (CROSS-SECTION CHAMBER) ================= -->
    <!-- Vacuum Vessel Outer Boundary Shell -->
    <path d="M 400 80 
             C 530 80, 620 180, 620 310 
             C 620 420, 520 480, 480 500 
             L 450 530 L 350 530 L 320 500 
             C 280 480, 180 420, 180 310 
             C 180 180, 270 80, 400 80 Z" 
          fill="none" stroke="#35D6FF" stroke-width="2.5" stroke-opacity="0.4" />

    <!-- First Wall / Blanket Structure (Inner Protective Layer) -->
    <path d="M 400 105 
             C 505 105, 590 195, 590 310 
             C 590 405, 500 455, 465 475 
             L 440 505 L 360 505 L 335 475 
             C 300 455, 210 405, 210 310 
             C 210 195, 295 105, 400 105 Z" 
          fill="none" stroke="#9B7CFF" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6" />

    <!-- Central Solenoid Column / Inner Wall Anchor -->
    <rect x="382" y="60" width="36" height="480" rx="4" fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Divertor Exhaust Target Cassettes (Bottom Chamber Structure) -->
    <path d="M 330 480 L 360 525 L 385 490" fill="none" stroke="#35D6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 470 480 L 440 525 L 415 490" fill="none" stroke="#35D6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- ================= 2. D-SHAPED PLASMA CROSS-SECTION CORE ================= -->
    <!-- Plasma Core Glow Volume -->
    <path d="M 400 140 
             C 475 140, 540 210, 540 310 
             C 540 390, 470 425, 440 445 
             L 415 470 L 385 470 L 360 445 
             C 330 425, 260 390, 260 310 
             C 260 210, 325 140, 400 140 Z" 
          fill="url(#plasma-core-grad)" />

    <!-- Magnetic Separatrix Edge / Last Closed Flux Surface -->
    <path d="M 400 140 
             C 475 140, 540 210, 540 310 
             C 540 390, 470 425, 440 445 
             L 400 490 L 360 445 
             C 330 425, 260 390, 260 310 
             C 260 210, 325 140, 400 140 Z" 
          fill="none" stroke="#FFB84D" stroke-width="2" filter="url(#glow-orange)" />

    <!-- Divertor Exhaust Legs (Plumes directed downwards) -->
    <path d="M 400 490 L 350 520" fill="none" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" filter="url(#glow-orange)" />
    <path d="M 400 490 L 450 520" fill="none" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" filter="url(#glow-orange)" />

    <!-- Concentric Internal Magnetic Flux Surface Contours -->
    <path d="M 400 180 C 450 180, 500 230, 500 310 C 500 370, 450 400, 400 410 C 350 400, 300 370, 300 310 C 300 230, 350 180, 400 180 Z" fill="none" stroke="#9B7CFF" stroke-width="1.2" stroke-opacity="0.7" />
    <path d="M 400 220 C 430 220, 460 250, 460 310 C 460 350, 430 375, 400 380 C 370 375, 340 350, 340 310 C 340 250, 370 220, 400 220 Z" fill="none" stroke="#35D6FF" stroke-width="1" stroke-opacity="0.6" />

    <!-- Ultra-Hot Core Center Axis -->
    <ellipse cx="400" cy="310" rx="14" ry="24" fill="#FFB84D" filter="url(#glow-orange)" />
    <ellipse cx="400" cy="310" rx="5" ry="10" fill="#FFFFFF" />

    <!-- ================= 3. HEAT & NEUTRON FLUX ARROWS (OUTWARD DIRECTION) ================= -->
    <g stroke-linecap="round">
      <!-- High Energy Neutrons / Heat Flux Arrows (Warm Orange) -->
      <!-- Top-Right -->
      <line x1="480" y1="200" x2="555" y2="155" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <!-- Right Equator -->
      <line x1="520" y1="310" x2="580" y2="310" stroke="#FFB84D" stroke-width="2.2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <!-- Bottom-Right -->
      <line x1="480" y1="410" x2="545" y2="450" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <!-- Top-Left -->
      <line x1="320" y1="200" x2="245" y2="155" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <!-- Left Equator -->
      <line x1="280" y1="310" x2="220" y2="310" stroke="#FFB84D" stroke-width="2.2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <!-- Bottom-Left -->
      <line x1="320" y1="410" x2="255" y2="450" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <!-- Top Vertical -->
      <line x1="400" y1="150" x2="400" y2="112" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />

      <!-- Secondary Isotropic Flux Beams (Soft Violet / Uncharged Neutrons) -->
      <line x1="450" y1="165" x2="505" y2="115" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#flux-arrow-violet)" />
      <line x1="510" y1="250" x2="575" y2="230" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#flux-arrow-violet)" />
      <line x1="510" y1="370" x2="570" y2="395" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#flux-arrow-violet)" />
      <line x1="350" y1="165" x2="295" y2="115" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#flux-arrow-violet)" />
      <line x1="290" y1="250" x2="225" y2="230" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#flux-arrow-violet)" />
      <line x1="290" y1="370" x2="230" y2="395" stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#flux-arrow-violet)" />
      <!-- Divertor High-Heat Target Flux -->
      <line x1="375" y1="480" x2="350" y2="515" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
      <line x1="425" y1="480" x2="450" y2="515" stroke="#FFB84D" stroke-width="2" marker-end="url(#flux-arrow-orange)" filter="url(#glow-orange)" />
    </g>

    <!-- ================= 4. FAINT WARNING / IMPACT DOTS ON WALL STRUCTURE ================= -->
    <g fill="#FFB84D" filter="url(#glow-orange)">
      <!-- Impact Hotspots at Wall Intersection Points -->
      <circle cx="560" cy="150" r="3.5" opacity="0.85" />
      <circle cx="585" cy="310" r="4" opacity="0.95" />
      <circle cx="550" cy="455" r="3.5" opacity="0.85" />
      <circle cx="240" cy="150" r="3.5" opacity="0.85" />
      <circle cx="215" cy="310" r="4" opacity="0.95" />
      <circle cx="250" cy="455" r="3.5" opacity="0.85" />
      <circle cx="400" cy="107" r="3.5" opacity="0.9" />

      <!-- Divertor Extreme Heat Impact Points -->
      <circle cx="348" cy="518" r="4" opacity="0.95" />
      <circle cx="452" cy="518" r="4" opacity="0.95" />

      <!-- Neutron Damage Material Impact Warning Indicators (Faint Pulses) -->
      <circle cx="510" cy="110" r="2.5" fill="#9B7CFF" opacity="0.7" />
      <circle cx="580" cy="225" r="2.5" fill="#9B7CFF" opacity="0.7" />
      <circle cx="575" cy="400" r="2.5" fill="#9B7CFF" opacity="0.7" />
      <circle cx="290" cy="110" r="2.5" fill="#9B7CFF" opacity="0.7" />
      <circle cx="220" cy="225" r="2.5" fill="#9B7CFF" opacity="0.7" />
      <circle cx="225" cy="400" r="2.5" fill="#9B7CFF" opacity="0.7" />
    </g>

    <!-- Pulsing Concentric Warning Rings at Wall Impact Points -->
    <g fill="none" stroke="#FFB84D" stroke-width="1" opacity="0.5">
      <circle cx="585" cy="310" r="8" stroke-dasharray="2 2" />
      <circle cx="215" cy="310" r="8" stroke-dasharray="2 2" />
      <circle cx="348" cy="518" r="7" stroke-dasharray="2 2" />
      <circle cx="452" cy="518" r="7" stroke-dasharray="2 2" />
    </g>
  </g>
</svg>
