<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.85" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- NOTE: TRANSPARENT BACKGROUND (No background rect or fill) -->

  <!-- Abstract Alignment Grid & Target Rings -->
  <g stroke="#35D6FF" stroke-width="1" opacity="0.1" fill="none">
    <circle cx="600" cy="450" r="180" stroke-dasharray="4 8" />
    <circle cx="600" cy="450" r="260" stroke-dasharray="6 6" />
    <line x1="150" y1="200" x2="1050" y2="200" stroke-dasharray="4 4" />
  </g>

  <!-- ==================== CONNECTING VECTOR LINES ==================== -->
  <g id="connection-lines" stroke-width="2" fill="none">
    <!-- Left Icon (Temperature) to Central Core -->
    <path d="M 250 200 L 250 320 L 600 450" stroke="#35D6FF" stroke-dasharray="6 4" opacity="0.75" filter="url(#glow-cyan)" />
    
    <!-- Middle Icon (Density) to Central Core -->
    <path d="M 600 200 L 600 450" stroke="#9B7CFF" stroke-dasharray="6 4" opacity="0.75" filter="url(#glow-violet)" />
    
    <!-- Right Icon (Confinement Time) to Central Core -->
    <path d="M 950 200 L 950 320 L 600 450" stroke="#35D6FF" stroke-dasharray="6 4" opacity="0.75" filter="url(#glow-cyan)" />
  </g>

  <!-- ==================== TOP ICON ROW ==================== -->

  <!-- ICON 1 (LEFT): THERMOMETER ICON -->
  <g id="icon-temperature" transform="translate(250, 200)">
    <!-- Outer Node Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#35D6FF" stroke-width="1.5" opacity="0.4" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />

    <!-- Minimal Geometric Thermometer Shape -->
    <!-- Bulb -->
    <circle cx="0" cy="16" r="12" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="0" cy="16" r="12" fill="none" stroke="#35D6FF" stroke-width="2" />
    <!-- Stem -->
    <path d="M -6 -18 L -6 8 A 12 12 0 0 0 6 8 L 6 -18 Z" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />
    <circle cx="0" cy="-18" r="6" fill="none" stroke="#35D6FF" stroke-width="2" />
    <!-- Rising Mercury Core -->
    <line x1="0" y1="16" x2="0" y2="-6" stroke="#FFB84D" stroke-width="4" stroke-linecap="round" filter="url(#glow-gold)" />
    <!-- Scale Ticks -->
    <line x1="10" y1="-8" x2="15" y2="-8" stroke="#35D6FF" stroke-width="1.5" />
    <line x1="10" y1="0" x2="15" y2="0" stroke="#35D6FF" stroke-width="1.5" />
    <line x1="10" y1="8" x2="15" y2="8" stroke="#35D6FF" stroke-width="1.5" />
  </g>

  <!-- ICON 2 (CENTER): DENSITY / PARTICLE CLUSTER ICON -->
  <g id="icon-density" transform="translate(600, 200)">
    <!-- Outer Node Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#9B7CFF" stroke-width="1.5" opacity="0.4" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#9B7CFF" stroke-width="2" filter="url(#glow-violet)" />

    <!-- Variable Spacing Dot Cluster (High density center, sparse outer) -->
    <!-- Dense Central Cluster -->
    <circle cx="0" cy="0" r="5" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="-8" cy="-6" r="4" fill="#9B7CFF" filter="url(#glow-violet)" />
    <circle cx="7" cy="-7" r="4" fill="#35D6FF" filter="url(#glow-cyan)" />
    <circle cx="-6" cy="8" r="4" fill="#35D6FF" filter="url(#glow-cyan)" />
    <circle cx="8" cy="6" r="4" fill="#9B7CFF" filter="url(#glow-violet)" />
    
    <!-- Medium Spaced Ring -->
    <circle cx="-18" cy="-2" r="3" fill="#9B7CFF" opacity="0.8" />
    <circle cx="19" cy="1" r="3" fill="#35D6FF" opacity="0.8" />
    <circle cx="-2" cy="-19" r="3" fill="#35D6FF" opacity="0.8" />
    <circle cx="1" cy="18" r="3" fill="#9B7CFF" opacity="0.8" />

    <!-- Outer Sparse Ring -->
    <circle cx="-25" cy="-16" r="2" fill="#35D6FF" opacity="0.5" />
    <circle cx="26" cy="-15" r="2" fill="#9B7CFF" opacity="0.5" />
    <circle cx="-22" cy="21" r="2" fill="#9B7CFF" opacity="0.5" />
    <circle cx="24" cy="20" r="2" fill="#35D6FF" opacity="0.5" />
  </g>

  <!-- ICON 3 (RIGHT): HOURGLASS / CONFINEMENT TIME ICON -->
  <g id="icon-time" transform="translate(950, 200)">
    <!-- Outer Node Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#35D6FF" stroke-width="1.5" opacity="0.4" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />

    <!-- Geometric Hourglass Shape -->
    <path d="M -18 -20 L 18 -20 L 2 0 L 18 20 L -18 20 L -2 0 Z" 
          fill="none" stroke="#35D6FF" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)" />
    <!-- Top & Bottom Plates -->
    <line x1="-22" y1="-20" x2="22" y2="-20" stroke="#35D6FF" stroke-width="2" />
    <line x1="-22" y1="20" x2="22" y2="20" stroke="#35D6FF" stroke-width="2" />
    
    <!-- Glowing Sand/Energy Flow Core -->
    <polygon points="-10,-15 10,-15 0,-3" fill="#FFB84D" opacity="0.6" filter="url(#glow-gold)" />
    <polygon points="-12,18 12,18 0,6" fill="#FFB84D" opacity="0.85" filter="url(#glow-gold)" />
    <line x1="0" y1="-3" x2="0" y2="6" stroke="#FFB84D" stroke-width="1.5" filter="url(#glow-gold)" />
  </g>

  <!-- ==================== CENTRAL CONVERGENCE POINT (LAWSON CRITERION FUSION CORE) ==================== -->
  <g id="central-fusion-point" transform="translate(600, 450)">
    <!-- Outer Radiant Energy Aura -->
    <circle cx="0" cy="0" r="90" fill="#FFB84D" fill-opacity="0.06" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="60" fill="#FFB84D" fill-opacity="0.12" filter="url(#glow-gold)" />

    <!-- Concentric Alignment Bounds -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FFB84D" stroke-width="2.5" filter="url(#glow-gold)" />

    <!-- Inward Convergence Focus Vectors -->
    <g stroke="#9B7CFF" stroke-width="1.5" opacity="0.8">
      <line x1="-50" y1="0" x2="-34" y2="0" />
      <line x1="50" y1="0" x2="34" y2="0" />
      <line x1="0" y1="-50" x2="0" y2="-34" />
      <line x1="0" y1="50" x2="0" y2="34" />
    </g>

    <!-- Intense Glowing Ignition Core -->
    <circle cx="0" cy="0" r="16" fill="#FFB84D" fill-opacity="0.95" filter="url(#glow-gold)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" filter="url(#glow-gold)" />
  </g>
</svg>
