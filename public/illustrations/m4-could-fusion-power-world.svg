<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- ================= 1. BACKGROUND GRID & ORBITAL GUIDES ================= -->
    <!-- Soft Perspective Ground Grid Lines -->
    <g stroke="#9B7CFF" stroke-width="1" opacity="0.18">
      <line x1="100" y1="460" x2="900" y2="460" />
      <line x1="100" y1="490" x2="900" y2="490" stroke-dasharray="4 4" />
      <line x1="100" y1="520" x2="900" y2="520" stroke-dasharray="2 4" />
      
      <!-- Grid Perspective Convergence Lines -->
      <line x1="150" y1="530" x2="220" y2="440" />
      <line x1="350" y1="530" x2="380" y2="440" />
      <line x1="500" y1="530" x2="500" y2="440" />
      <line x1="650" y1="530" x2="620" y2="440" />
      <line x1="850" y1="530" x2="780" y2="440" />
    </g>

    <!-- Speculative Celestial Halo above the city skyline -->
    <circle cx="500" cy="150" r="110" fill="none" stroke="#9B7CFF" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 6" />
    <circle cx="500" cy="150" r="80" fill="none" stroke="#35D6FF" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 4" />

    <!-- ================= 2. STYLIZED CITY SKYLINE SILHOUETTE ================= -->
    <!-- Clean Minimalist Geometric Buildings Outlines -->
    <g fill="none" stroke="#9B7CFF" stroke-width="1.8" stroke-linejoin="round" opacity="0.6">
      <!-- Far Left Low-Rises -->
      <path d="M 120 460 L 120 410 L 160 410 L 160 460" />
      <path d="M 160 460 L 160 380 L 195 380 L 195 460" />
      
      <!-- Left High-Rise Complex -->
      <path d="M 210 460 L 210 320 L 255 320 L 255 460" />
      <path d="M 255 460 L 255 270 L 290 270 L 310 300 L 310 460" />
      
      <!-- Mid-Left Spire Tower -->
      <path d="M 330 460 L 330 350 L 360 350 L 360 460" />
      <path d="M 375 460 L 375 240 L 395 210 L 415 240 L 415 460" />
      
      <!-- Center City Core (Under Question Mark) -->
      <path d="M 430 460 L 430 330 L 470 330 L 470 460" />
      <path d="M 480 460 L 480 290 L 520 290 L 520 460" />
      <path d="M 530 460 L 530 340 L 570 340 L 570 460" />

      <!-- Mid-Right Tower Complex -->
      <path d="M 585 460 L 585 230 L 610 230 L 625 250 L 625 460" />
      <path d="M 640 460 L 640 310 L 680 310 L 680 460" />

      <!-- Right High-Rise & Suburbs -->
      <path d="M 695 460 L 695 280 L 735 280 L 735 460" />
      <path d="M 750 460 L 750 370 L 785 370 L 785 460" />
      <path d="M 790 460 L 790 415 L 830 415 L 830 460" />
      <path d="M 835 460 L 835 430 L 870 430 L 870 460" />
    </g>

    <!-- Skyline Geometric Window Accents (Minimal Grid Points) -->
    <g fill="#35D6FF" opacity="0.4">
      <rect x="225" y="340" width="3" height="3" />
      <rect x="240" y="340" width="3" height="3" />
      <rect x="225" y="360" width="3" height="3" />
      <rect x="240" y="360" width="3" height="3" />

      <rect x="270" y="300" width="3" height="3" />
      <rect x="285" y="300" width="3" height="3" />
      <rect x="270" y="320" width="3" height="3" />
      <rect x="285" y="320" width="3" height="3" />

      <rect x="388" y="260" width="4" height="4" />
      <rect x="388" y="280" width="4" height="4" />
      <rect x="388" y="300" width="4" height="4" />

      <rect x="492" y="320" width="3" height="3" />
      <rect x="505" y="320" width="3" height="3" />
      <rect x="492" y="340" width="3" height="3" />
      <rect x="505" y="340" width="3" height="3" />

      <rect x="595" y="270" width="3" height="3" />
      <rect x="610" y="270" width="3" height="3" />
      <rect x="595" y="290" width="3" height="3" />
      <rect x="610" y="290" width="3" height="3" />

      <rect x="710" y="310" width="3" height="3" />
      <rect x="722" y="310" width="3" height="3" />
      <rect x="710" y="330" width="3" height="3" />
      <rect x="722" y="330" width="3" height="3" />
    </g>

    <!-- Baseline City Grid Axis Line -->
    <line x1="80" y1="460" x2="920" y2="460" stroke="#35D6FF" stroke-width="2" opacity="0.8" filter="url(#glow-cyan)" />

    <!-- ================= 3. SCATTERED POWER SOURCE NODES ================= -->
    <!-- Node A: Solar/Radiant Icon (Left Sky/Building) -->
    <g transform="translate(180, 330)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#FFB84D" stroke-width="1.8" filter="url(#glow-orange)" />
      <circle cx="0" cy="0" r="6" fill="#FFB84D" filter="url(#glow-orange)" />
      <!-- Ray Accents -->
      <path d="M 0 -24 L 0 -28 M 0 24 L 0 28 M -24 0 L -28 0 M 24 0 L 28 0" stroke="#FFB84D" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-orange)" />
    </g>

    <!-- Node B: Wind/Kinetic Turbine Icon (Mid-Left Ground Grid) -->
    <g transform="translate(345, 410)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <!-- Tri-blade shape -->
      <path d="M 0 0 L 0 -12 M 0 0 L 10 6 M 0 0 L -10 6" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>

    <!-- Node C: Hydro/Flow Wave Icon (Mid-Right Skyline) -->
    <g transform="translate(660, 380)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <path d="M -9 -2 C -4 -7, 4 3, 9 -2" fill="none" stroke="#35D6FF" stroke-width="2" stroke-linecap="round" filter="url(#glow-cyan)" />
      <path d="M -9 3 C -4 -2, 4 8, 9 3" fill="none" stroke="#FFB84D" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-orange)" opacity="0.8" />
    </g>

    <!-- Node D: Fission/Atom Loop Icon (Far-Right Building Peak) -->
    <g transform="translate(810, 350)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#9B7CFF" stroke-width="1.5" opacity="0.6" />
      <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#9B7CFF" stroke-width="1.5" transform="rotate(30)" filter="url(#glow-violet)" />
      <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#9B7CFF" stroke-width="1.5" transform="rotate(-30)" filter="url(#glow-violet)" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="url(#glow-cyan)" />
    </g>

    <!-- Node E: Fusion / Tokamak Core Icon (Speculative Center-Right Candidate) -->
    <g transform="translate(500, 380)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FFB84D" stroke-width="1.8" stroke-dasharray="3 3" filter="url(#glow-orange)" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="5" fill="#FFB84D" filter="url(#glow-orange)" />
    </g>

    <!-- Interconnecting Grid Signal Rays (Dotted Networks) -->
    <g stroke="#9B7CFF" stroke-width="1" opacity="0.4" stroke-dasharray="2 4">
      <line x1="180" y1="330" x2="345" y2="410" />
      <line x1="345" y1="410" x2="500" y2="380" />
      <line x1="500" y1="380" x2="660" y2="380" />
      <line x1="660" y1="380" x2="810" y2="350" />
      <!-- Vertical Feeders to Baseline -->
      <line x1="180" y1="330" x2="180" y2="460" />
      <line x1="500" y1="380" x2="500" y2="460" />
      <line x1="810" y1="350" x2="810" y2="460" />
    </g>

    <!-- ================= 4. SPECULATIVE HOVERING QUESTION MARK ================= -->
    <!-- Floating Above Center City Skyline -->
    <g transform="translate(500, 150)">
      <!-- Outer Pulsing Halo Rings -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFB84D" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" filter="url(#glow-orange)" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#35D6FF" stroke-width="1" opacity="0.5" />

      <!-- Stylized Clean Geometric Question Mark -->
      <path d="M -16 -12 
               C -16 -28, 16 -28, 16 -10 
               C 16 8, 0 6, 0 20" 
            fill="none" stroke="#FFB84D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-orange)" />
      
      <!-- Glowing Dot Bottom -->
      <circle cx="0" cy="34" r="3.5" fill="#FFFFFF" filter="url(#glow-cyan)" />
      <circle cx="0" cy="34" r="6" fill="none" stroke="#FFB84D" stroke-width="1.5" filter="url(#glow-orange)" />

      <!-- Minimal Flanking Speculative Sparks -->
      <circle cx="-30" cy="-18" r="2" fill="#35D6FF" filter="url(#glow-cyan)" opacity="0.8" />
      <circle cx="28" cy="10" r="2" fill="#9B7CFF" filter="url(#glow-violet)" opacity="0.8" />
      <circle cx="-22" cy="22" r="1.5" fill="#FFB84D" opacity="0.6" />
    </g>
  </g>
</svg>
