<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.85" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- NOTE: TRANSPARENT BACKGROUND (No background rect or fill) -->

  <!-- Abstract Cosmic Grid Alignments -->
  <g stroke="#35D6FF" stroke-width="1" opacity="0.1" fill="none">
    <circle cx="600" cy="380" r="280" stroke-dasharray="4 8" />
    <line x1="200" y1="560" x2="1000" y2="560" stroke-dasharray="4 4" />
  </g>

  <!-- ==================== BALANCE SCALE STRUCTURE ==================== -->
  <g id="scale-structure">
    <!-- Base / Stand -->
    <path d="M 520 560 L 680 560 L 620 500 L 580 500 Z" fill="none" stroke="#9B7CFF" stroke-width="2" opacity="0.6" />
    <line x1="600" y1="500" x2="600" y2="280" stroke="#9B7CFF" stroke-width="3" filter="url(#glow-violet)" />
    
    <!-- Central Fulcrum / Pivot Point -->
    <circle cx="600" cy="280" r="10" fill="none" stroke="#35D6FF" stroke-width="2.5" filter="url(#glow-cyan)" />
    <circle cx="600" cy="280" r="4" fill="#35D6FF" />

    <!-- Tilted Main Beam (Tilted counter-clockwise: Left side lower/heavier, Right side higher/lighter) -->
    <!-- Pivot at (600, 280), Angle approx -6 degrees -->
    <line x1="250" y1="316" x2="950" y2="244" stroke="#35D6FF" stroke-width="3" filter="url(#glow-cyan)" />

    <!-- Left Hanging String Assembly -->
    <line x1="250" y1="316" x2="250" y2="420" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />
    <!-- Left Pan Platform -->
    <path d="M 170 420 L 330 420 C 330 445, 170 445, 170 420 Z" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />

    <!-- Right Hanging String Assembly -->
    <line x1="950" y1="244" x2="950" y2="348" stroke="#35D6FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />
    <!-- Right Pan Platform -->
    <path d="M 870 348 L 1030 348 C 1030 373, 870 373, 870 348 Z" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />
  </g>

  <!-- ==================== LEFT PAN: INITIAL NUCLEI (HEAVIER) ==================== -->
  <g id="left-reactants" transform="translate(250, 388)">
    <!-- Reactant Nucleus 1 (Deuterium-like) -->
    <g transform="translate(-35, 0)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="15" fill="#35D6FF" fill-opacity="0.3" />
      <circle cx="-5" cy="0" r="5" fill="#35D6FF" />
      <circle cx="5" cy="0" r="5" fill="none" stroke="#35D6FF" stroke-width="1.5" />
    </g>

    <!-- Reactant Nucleus 2 (Tritium-like) -->
    <g transform="translate(35, -4)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#9B7CFF" stroke-width="2" filter="url(#glow-violet)" />
      <circle cx="0" cy="0" r="18" fill="#9B7CFF" fill-opacity="0.3" />
      <circle cx="0" cy="-6" r="5" fill="#9B7CFF" />
      <circle cx="-6" cy="5" r="5" fill="none" stroke="#9B7CFF" stroke-width="1.5" />
      <circle cx="6" cy="5" r="5" fill="none" stroke="#9B7CFF" stroke-width="1.5" />
    </g>
  </g>

  <!-- ==================== RIGHT PAN: FUSION PRODUCTS (LIGHTER) ==================== -->
  <g id="right-products" transform="translate(950, 316)">
    <!-- Fusion Product 1: Helium Nucleus -->
    <g transform="translate(-25, 0)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#35D6FF" stroke-width="2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="16" fill="#35D6FF" fill-opacity="0.3" />
      <circle cx="-6" cy="-6" r="4.5" fill="#35D6FF" />
      <circle cx="6" cy="-6" r="4.5" fill="none" stroke="#35D6FF" stroke-width="1.5" />
      <circle cx="-6" cy="6" r="4.5" fill="none" stroke="#35D6FF" stroke-width="1.5" />
      <circle cx="6" cy="6" r="4.5" fill="#35D6FF" />
    </g>

    <!-- Fusion Product 2: Free Neutron -->
    <g transform="translate(35, 8)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#35D6FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="4" fill="#35D6FF" />
    </g>
  </g>

  <!-- ==================== MISSING MASS TO ENERGY (GLOWING WISP) ==================== -->
  <g id="energy-release" transform="translate(950, 280)">
    <!-- Outward Radiating Energy Aura from the missing mass gap -->
    <circle cx="0" cy="-60" r="45" fill="#FFB84D" fill-opacity="0.08" filter="url(#glow-gold)" />

    <!-- Ascending Glowing Energy Wisps / Waves -->
    <path d="M -15 10 C -25 -20, -5 -40, -18 -70 C -25 -90, -10 -110, -20 -130" 
          fill="none" stroke="#FFB84D" stroke-width="2.5" opacity="0.85" stroke-linecap="round" filter="url(#glow-gold)" />
    
    <path d="M 0 15 C 10 -15, -10 -45, 5 -80 C 15 -105, 0 -125, 8 -150" 
          fill="none" stroke="#FFB84D" stroke-width="3" stroke-dasharray="8 4" opacity="0.9" filter="url(#glow-gold)" />
    
    <path d="M 15 10 C 25 -20, 5 -40, 18 -70 C 25 -90, 10 -110, 20 -130" 
          fill="none" stroke="#FFB84D" stroke-width="2" opacity="0.7" stroke-linecap="round" filter="url(#glow-gold)" />

    <!-- Radiant Energy Sparkles / Photons -->
    <circle cx="-20" cy="-130" r="3" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="8" cy="-150" r="4" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="20" cy="-130" r="3" fill="#FFB84D" filter="url(#glow-gold)" />
    <circle cx="-5" cy="-80" r="2.5" fill="#FFB84D" filter="url(#glow-gold)" />
  </g>
</svg>
